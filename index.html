<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0" />
    <title>Sequence</title>
    <link rel="stylesheet" href="sequence.css">
    <link rel="stylesheet" href="overlay.css">
    <link rel="preload" as="image" href="checker.jpg">
    <link rel="preload" as="image" href="greenChecker.bmp">
    <script type="module" src="Operators.js"></script>
    <script type="module" src="Grid.js"></script>
    <script type="module" src="MoveHistory.js"></script>
    <script type="module" src="ElementUpdater.js" defer></script>
    <script type="module" src="sequence.js" defer></script>
</head>
<body>
    <div class="game">
        <div id="operators" class="operatorsRight">
            <div class="operator pastOperator invisibleOperator beforeStart ÷">÷</div>
            <div class="operator pastOperator beforeStart +">+</div>
            <div class="operator pastOperator beforeStart ×">×</div>
            <div class="operator pastOperator beforeStart ÷">÷</div>
            <div class="operator currentOperator +">+</div>
            <div class="operator ×">×</div>
            <div class="operator ÷">÷</div>
            <div class="operator +">+</div>
            <div class="operator invisibleOperator ×">×</div>
        </div>
        <div id="score">= 0 +</div>
        <table id="grid">
            <tr>
                <td id="0|0"></td>
                <td id="0|1"></td>
                <td id="0|2"></td>
                <td id="0|3"></td>
            </tr>
            <tr>
                <td id="1|0"></td>
                <td id="1|1"></td>
                <td id="1|2"></td>
                <td id="1|3"></td>
            </tr>
            <tr>
                <td id="2|0"></td>
                <td id="2|1"></td>
                <td id="2|2"></td>
                <td id="2|3"></td>
            </tr>
            <tr>
                <td id="3|0"></td>
                <td id="3|1"></td>
                <td id="3|2"></td>
                <td id="3|3"></td>
            </tr>
            <tr>
                <td id="4|0"></td>
                <td id="4|1"></td>
                <td id="4|2"></td>
                <td id="4|3"></td>
            </tr>
            <tr>
                <td id="5|0"></td>
                <td id="5|1"></td>
                <td id="5|2"></td>
                <td id="5|3"></td>
            </tr>
        </table>
        <p>
            <strong id="title">SEQUENCE</strong>
            <br>A daily number puzzle by Aidan & Carter Beck.
        </p>

        <div id="overlay" class="">
            <div id="tutorial" class="">
                <h1>SEQUENCE</h1>
                <h2>How To Play</h2>
                <ul>
                    <li>Connect the START and End tiles.</li>
                    <li>Each step Adds, Multiplies, or Divides.</li>
                    <li>Draw a line with the highest score.</li>
                </ul>
                <div id="tutorialStart">Tap here to continue.</div>
            </div>
            <div id="leaderboard" class="hidden">
                <h1>SEQUENCE</h1>
                <p>Leaderboard Stats:</p>
                <p id="totalBetter"></p>
                <p id="totalTied"></p>
                <p id="total"></p>
                <p id="shareString"></p>
            </div>
        </div>

    </div>

</body>
</html>
